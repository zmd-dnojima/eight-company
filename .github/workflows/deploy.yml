name: Deploy to Onamae.com RS

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Build Gatsby Site
      run: npm run build
      env:
        NODE_ENV: production
        MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        MICROCMS_SERVICE_ID: ${{ secrets.MICROCMS_SERVICE_ID }}
    - name: Rename system folders for Onamae.com
      run: |
        # 1. _gatsby の対策
        if [ -d "public/_gatsby" ]; then
          mv public/_gatsby public/assets-gatsby
          find public -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i 's/\/_gatsby\//\/assets-gatsby\//g' {} +
          echo "Successfully renamed _gatsby to assets-gatsby"
        fi
        
        # 2. ~partytown の対策（チルダを通常の「partytown」という名前に変えます）
        if [ -d "public/~partytown" ]; then
          mv public/~partytown public/partytown
          find public -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i 's/\/~partytown\//\/partytown\//g' {} +
          echo "Successfully renamed ~partytown to partytown"
        fi
        # 3. 404 フォルダの対策（上の階層との競合を完全に回避します）
        if [ -d "public/404" ]; then
          mv public/404 public/page-404
          find public -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i 's/\/404\//\/page-404\//g' {} +
        fi

    - name: Sync files to Onamae.com
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./public/
        server-dir: /public_html/eight-company.com/test/
        state-name: .ftp-deploy-sync-state.json
        port: 21
