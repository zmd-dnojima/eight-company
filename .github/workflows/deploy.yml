```yaml
name: Deploy to Onamae.com RS

on:
  push:
    branches:
      - main # mainブランチにプッシュされたら起動

jobs:
  web-deploy:
    name: 🎉 Build and Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 🧰 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # お使いの環境に合わせて調整してください

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🏗️ Build Gatsby Site
      run: npm run build
      env:
        # ※もしmicroCMSのAPIキーなどを環境変数にしている場合はここに追記します
        NODE_ENV: production
        GATSBY_MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        GATSBY_MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_ENV_DOMAIN }}

    - name: 🚀 Sync files to Onamae.com
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./public/ # Gatsbyが書き出した公開用フォルダ
        server-dir: /public_html/eight-company.com/test/ # 👈ここをお名前.comの実際の公開フォルダのパスに書き換えてください！
